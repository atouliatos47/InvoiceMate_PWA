<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0ea5a0" />
  <meta name="description" content="Simple invoice app for self-employed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>InvoiceMate</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Start screen ──────────────────────────────────────
       First thing on screen every time the app opens: the InvoiceMate
       logo from the Flutter app, on the logo's own grey (the same grey
       Android's splash uses, from manifest.json, so the two run into
       each other). With no PIN set it fades out on its own; with a PIN
       set the keypad below appears and it waits. See js/lock.js. -->
  <div id="start-screen" class="start-screen">
    <img src="icons/icon-512.png" alt="InvoiceMate" class="start-logo" />
    <!-- A brand-new copy: the invite code (or Sharon's owner code) first. See js/access.js. -->
    <div id="access-panel" class="access-panel hidden">
      <div class="access-title">Enter your invite code</div>
      <input id="access-code" class="access-input" type="text" maxlength="16" placeholder="XXXX-XXXX"
             autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Invite code" />
      <button id="access-btn" class="go-btn" type="button">Go</button>
      <div class="access-msg" id="access-msg">Ask the person who shared InvoiceMate with you.</div>
    </div>
    <!-- No PIN set: tap Go to start. (With a PIN, the keypad below is the way in.) -->
    <button id="go-btn" class="go-btn hidden" type="button">Go</button>
    <div id="lock-panel" class="lock-panel hidden">
      <div class="lock-title" id="lock-title">Enter your PIN</div>
      <div class="pin-dots" id="pin-dots"></div>
      <div class="pin-pad" id="pin-pad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="forgot" class="pin-text">Forgot?</button><button data-key="0">0</button><button data-key="back" class="pin-text">&#x232B;</button>
      </div>
    </div>
    <!-- Which version this device is running (APP_VERSION in js/app.js) -->
    <div class="start-version" id="app-version"></div>
  </div>

  <!-- ── Top bar ─────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <!-- The InvoiceMate logo (cropped from icons/icon-512.png), then the name -->
      <img src="icons/logo-bar.png" alt="" class="topbar-logo" width="40" height="40" />
      <span class="logo-text">InvoiceMate</span>
    </div>
    <div class="topbar-right">
      <span id="install-btn" class="btn btn-outline hidden" style="color:#fff;border-color:rgba(255,255,255,0.5);font-size:0.8rem;padding:6px 12px">Install</span>
      <!-- App Guide — the ⓘ icon, first in the row like the Flutter app's (js/guide.js) -->
      <button class="topbar-icon-btn" onclick="Guide.open()" aria-label="App Guide" title="App Guide">
        <svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      </button>
      <!-- Statistics — the chart icon, like the Flutter app's (js/stats.js) -->
      <button class="topbar-icon-btn" onclick="Stats.open()" aria-label="Statistics" title="Statistics">
        <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
      </button>
      <!-- My Details — the person icon, where the Flutter app has it -->
      <button class="topbar-icon-btn" onclick="MyDetails.open()" aria-label="My Details" title="My Details">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </button>
    </div>
  </header>

  <!-- ── My Details page (js/details.js) — full screen over the app ── -->
  <div id="details-page" class="md-page hidden"></div>

  <!-- ── App Guide (js/guide.js) — full screen over the app ── -->
  <div id="guide-page" class="md-page ag-page hidden"></div>

  <!-- ── Statistics page (js/stats.js) — full screen over the app ── -->
  <div id="stats-page" class="md-page st-page hidden"></div>

  <!-- ── New / Edit Invoice page (js/invoice-page.js) — full screen ── -->
  <div id="invoice-page" class="md-page ip-page hidden"></div>

  <!-- ── Main content area ───────────────────────────────── -->
  <main id="app">
    <div id="view-dashboard"  class="view"></div>
    <div id="view-invoices"   class="view hidden"></div>
    <div id="view-clients"    class="view hidden"></div>
    <div id="view-settings"   class="view hidden"></div>
  </main>

  <!-- ── Toast ───────────────────────────────────────────── -->
  <div id="toast" class="toast hidden"></div>

  <!-- ── Modal ───────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <button id="modal-close" class="modal-close">&#x2715;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- ── Bottom nav ──────────────────────────────────────────
       Invoices | big round Home in the middle | Clients.
       (No Settings button: Backup, PIN lock and invoice numbering are
       reached from the bottom of My Details — the person icon.) -->
  <nav class="bottom-nav">
    <button class="nav-btn" data-view="invoices">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Invoices</span>
    </button>
    <button class="nav-btn nav-home active" data-view="dashboard" aria-label="Home">
      <span class="nav-home-circle">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </span>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-view="clients">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span>Clients</span>
    </button>
  </nav>

  <!-- ── Scripts ──────────────────────────────────────────── -->
  <script src="js/vendor/pdf-lib.min.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/api.js"></script>
  <script src="js/access.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/clients.js"></script>
  <script src="js/invoices.js"></script>
  <script src="js/invoice-page.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/details.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
